<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us &mdash; GigCampus Erode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="text-center mb-4">
                        <span class="badge bg-light text-teal border px-3 py-2 fw-semibold mb-2" style="color: var(--gc-teal);">Support & Inquiries</span>
                        <h2 class="fw-bold text-navy">Get in Touch with GigCampus</h2>
                        <p class="text-muted">Questions regarding registration, business verification, or student onboardings in Erode?</p>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <div class="form-card text-center p-4 h-100">
                                <div class="stat-icon bg-light text-teal mx-auto mb-3" style="color: var(--gc-teal);"><i class="bi bi-geo-alt"></i></div>
                                <h6 class="fw-bold text-navy">District Office</h6>
                                <p class="small text-muted mb-0">Erode District, Tamil Nadu 638001</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-card text-center p-4 h-100">
                                <div class="stat-icon bg-light text-primary mx-auto mb-3"><i class="bi bi-envelope"></i></div>
                                <h6 class="fw-bold text-navy">Email Support</h6>
                                <p class="small text-muted mb-0">support@gigcampus.local</p>
                            </div>
                        </div>
                    </div>

                    <div class="form-card p-4 p-md-5">
                        <h5 class="fw-bold text-navy mb-3">Send a Message</h5>
                        <form onsubmit="alert('Thank you for contacting GigCampus Erode! We will get back to you shortly.'); return false;">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Your Name</label>
                                    <input type="text" class="form-control" required placeholder="e.g. Ramesh Kumar">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" class="form-control" required placeholder="e.g. ramesh@example.com">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Subject</label>
                                <input type="text" class="form-control" required placeholder="Verification help / Student query">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Message</label>
                                <textarea rows="4" class="form-control" required placeholder="How can we assist your business or student team?"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary-gc">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
