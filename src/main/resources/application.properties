spring.application.name=gigcampus
server.port=${SERVER_PORT:8080}

# Default Active Profile: uses 'mysql' when DB is available, or 'dev' for standalone development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Settings (for verification documents/resumes)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Default Admin Bootstrap Credentials (read from environment, defaults safe for local first-run)
app.admin.bootstrap.enabled=true
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@gigcampus.local}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@GigCampus2026}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Erode District Administrator}
app.admin.bootstrap.phone=${ADMIN_BOOTSTRAP_PHONE:9876543210}
