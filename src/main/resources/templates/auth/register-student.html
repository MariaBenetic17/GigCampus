<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="form-card p-4 p-md-5 shadow-sm">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon bg-light text-primary" style="width: 48px; height: 48px; font-size: 1.4rem;"><i class="bi bi-mortarboard-fill"></i></div>
                            <div>
                                <h3 class="fw-bold text-navy mb-0">Student Registration</h3>
                                <p class="text-muted small mb-0">Join GigCampus to work on real projects from local Erode businesses.</p>
                            </div>
                        </div>

                        <form th:action="@{/register/student}" th:object="${studentDto}" method="post">
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <span class="badge rounded-pill bg-light text-primary border">Step 1</span>
                                <h6 class="fw-bold text-navy mb-0">Personal & Account Information</h6>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-muted">Full Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" placeholder="e.g. Priya Sundaram">
                                <div class="invalid-feedback" th:errors="*{fullName}"></div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-muted">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="priya@kongu.edu.in">
                                    <div class="invalid-feedback" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-muted">Phone Number (10 digits) <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" placeholder="9842100000" maxlength="10">
                                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-muted">Password <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Min 6 characters">
                                    <div class="invalid-feedback" th:errors="*{password}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-muted">Confirm Password <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" placeholder="Re-type password">
                                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-2 mb-3 pt-3 border-top">
                                <span class="badge rounded-pill bg-light text-primary border">Step 2</span>
                                <h6 class="fw-bold text-navy mb-0">College & Academic Details</h6>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-muted">College / Institution in or around Erode <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{collegeName}" class="form-control" th:classappend="${#fields.hasErrors('collegeName')} ? 'is-invalid'" placeholder="e.g. Kongu Engineering College, Bannari Amman, IRTT">
                                <div class="invalid-feedback" th:errors="*{collegeName}"></div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-muted">Department / Branch <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{department}" class="form-control" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'" placeholder="e.g. Computer Science / IT / Commerce">
                                    <div class="invalid-feedback" th:errors="*{department}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-muted">Year of Study</label>
                                    <select th:field="*{yearOfStudy}" class="form-select">
                                        <option value="1st Year">1st Year</option>
                                        <option value="2nd Year">2nd Year</option>
                                        <option value="3rd Year" selected>3rd Year</option>
                                        <option value="Final Year">Final Year</option>
                                        <option value="Postgraduate">Postgraduate</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-muted">Digital Skills & Tools</label>
                                <input type="text" th:field="*{skills}" class="form-control" placeholder="e.g. HTML, Bootstrap, Canva, Excel, Python, Social Media">
                                <div class="form-text small">Comma-separated list of tools and capabilities you can deliver.</div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-muted">Location / Hostel Area</label>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Perundurai Campus / Erode City">
                            </div>

                            <button type="submit" class="btn btn-navy w-100 py-2 fs-6 fw-semibold">
                                <i class="bi bi-mortarboard me-1"></i> Complete Student Registration
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="small text-muted">Already registered as a student? <a th:href="@{/login}" class="fw-semibold text-teal" style="color: var(--gc-teal);">Sign in here</a></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
