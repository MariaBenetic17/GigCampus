<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Gig &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="form-card p-4 p-md-5">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon bg-light text-navy"><i class="bi bi-pencil-square"></i></div>
                            <div>
                                <h3 class="fw-bold text-navy mb-0">Edit Gig Listing</h3>
                                <p class="text-muted small mb-0">Update listing details, deadline, or publication status.</p>
                            </div>
                        </div>

                        <form th:action="@{'/business/gigs/' + ${gigDto.id} + '/edit'}" th:object="${gigDto}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Gig Title <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{title}"></div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">Service Category</label>
                                    <select th:field="*{categoryId}" class="form-select">
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Work Mode</label>
                                    <select th:field="*{workMode}" class="form-select">
                                        <option th:each="wm : ${workModes}" th:value="${wm.name()}" th:text="${wm.displayName}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Listing Status</label>
                                    <select th:field="*{status}" class="form-select">
                                        <option th:each="st : ${gigStatuses}" th:value="${st.name()}" th:text="${st.displayName}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Detailed Description</label>
                                <textarea th:field="*{description}" rows="6" class="form-control" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Required Skills</label>
                                <input type="text" th:field="*{requiredSkills}" class="form-control" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Budget (₹)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">₹</span>
                                        <input type="number" th:field="*{budget}" class="form-control" min="200" step="50" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Deadline</label>
                                    <input type="date" th:field="*{deadline}" class="form-control">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Location</label>
                                <input type="text" th:field="*{location}" class="form-control">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-navy py-2 px-4">
                                    Save Changes
                                </button>
                                <a th:href="@{/business/dashboard}" class="btn btn-outline-secondary py-2 px-3">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
