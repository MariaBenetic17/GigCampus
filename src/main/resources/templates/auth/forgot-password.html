<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="form-card p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3 fs-3 mb-2">
                                <i class="bi bi-key-fill"></i>
                            </div>
                            <h3 class="fw-bold text-navy">Forgot Password?</h3>
                            <p class="text-muted small">Enter your registered email and we'll help you securely reset your credentials.</p>
                        </div>

                        <form th:action="@{/forgot-password}" method="post">
                            <div class="mb-4">
                                <label for="email" class="form-label">Registered Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="email" name="email" class="form-control" required autofocus placeholder="name@domain.com">
                                </div>
                                <span class="form-text text-muted" style="font-size: 0.75rem;">
                                    For student test accounts: <code>priya.erode@kongu.edu.in</code> or <code>karthik.bannari@bitsathy.ac.in</code>
                                </span>
                            </div>

                            <button type="submit" class="btn btn-primary-gc w-100 py-2 fw-semibold">
                                <i class="bi bi-send-check me-1"></i> Send Reset Instructions
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a th:href="@{/login}" class="small text-decoration-none fw-semibold">
                                &larr; Back to Sign In
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
