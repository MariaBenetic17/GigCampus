<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-navy mb-1"><i class="bi bi-bell-fill text-teal me-2" style="color: var(--gc-teal);"></i>Your Notifications</h3>
                    <p class="text-muted small mb-0">Platform updates on applications, proposals, project milestones, and reviews.</p>
                </div>
                <form th:action="@{/notifications/read-all}" method="post">
                    <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-check2-all me-1"></i> Mark All as Read</button>
                </form>
            </div>

            <div class="form-card p-4">
                <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                    <i class="bi bi-bell-slash fs-1 text-muted"></i>
                    <h5 class="fw-bold text-dark mt-3">No Notifications</h5>
                    <p class="text-muted small mb-0">You're all caught up! New updates will appear here automatically.</p>
                </div>

                <div th:unless="${#lists.isEmpty(notifications)}" class="d-flex flex-column gap-2">
                    <div th:each="n : ${notifications}" class="p-3 rounded-3 border d-flex justify-content-between align-items-start gap-3"
                         th:classappend="${!n.read} ? 'bg-light border-teal-subtle' : 'bg-white'">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span th:if="${!n.read}" class="badge bg-danger rounded-pill" style="font-size: 0.6rem;">NEW</span>
                                <h6 class="fw-bold text-navy mb-0" th:text="${n.title}">Notification Title</h6>
                            </div>
                            <p class="small text-secondary mb-1" th:text="${n.message}">Notification message details...</p>
                            <div class="d-flex align-items-center gap-3 small text-muted">
                                <span><i class="bi bi-clock me-1"></i> <span th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</span></span>
                                <a th:if="${n.linkUrl != null}" th:href="${n.linkUrl}" class="fw-semibold text-teal text-decoration-none" style="color: var(--gc-teal);">
                                    View Details <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        </div>

                        <form th:if="${!n.read}" th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post">
                            <button type="submit" class="btn btn-sm btn-light border text-muted" title="Mark as read">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
