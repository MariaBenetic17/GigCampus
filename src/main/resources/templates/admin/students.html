<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students &mdash; Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-navy mb-1"><i class="bi bi-mortarboard-fill text-primary me-2"></i>Registered College Students</h3>
                    <p class="text-muted small mb-0">Total Students: <span th:text="${#lists.size(students)}">0</span></p>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Back to Overview</a>
            </div>

            <div class="form-card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light small">
                            <tr>
                                <th>Student Name</th>
                                <th>College & Dept</th>
                                <th>Skills</th>
                                <th>Contact</th>
                                <th>Account Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${students}">
                                <td>
                                    <strong class="text-dark" th:text="${s.fullName}">Student Name</strong>
                                    <div class="small text-muted" th:text="${s.email}">email</div>
                                </td>
                                <td>
                                    <div th:text="${s.studentProfile != null ? s.studentProfile.collegeName : 'N/A'}">College</div>
                                    <div class="small text-muted" th:text="${s.studentProfile != null ? s.studentProfile.department : ''}">Dept</div>
                                </td>
                                <td style="max-width: 200px;">
                                    <span class="small text-secondary" th:text="${s.studentProfile != null ? s.studentProfile.skills : 'None'}">Skills</span>
                                </td>
                                <td>
                                    <span class="small text-muted" th:text="${s.phone != null ? s.phone : 'Not provided'}">Phone</span>
                                </td>
                                <td>
                                    <span th:if="${s.active}" class="badge bg-success-subtle text-success border border-success-subtle">Active</span>
                                    <span th:unless="${s.active}" class="badge bg-danger-subtle text-danger border border-danger-subtle">Suspended</span>
                                </td>
                                <td>
                                    <form th:action="@{'/admin/users/' + ${s.id} + '/toggle-active'}" method="post">
                                        <button type="submit" class="btn btn-sm" th:classappend="${s.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                th:text="${s.active} ? 'Suspend' : 'Reactivate'"
                                                data-confirm="Toggle this user's active status?">
                                            Toggle
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
