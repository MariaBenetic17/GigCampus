<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Client Review &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="form-card p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="stat-icon bg-light text-warning mx-auto mb-2"><i class="bi bi-star-fill"></i></div>
                            <h3 class="fw-bold text-navy">Submit Client Review</h3>
                            <p class="text-muted small">Share your experience collaborating with this Erode business owner.</p>
                        </div>

                        <div class="p-3 bg-light rounded-3 mb-4 small">
                            <div><strong>Gig:</strong> <span th:text="${gig.title}">Gig Title</span></div>
                            <div><strong>Business:</strong> <span th:text="${gig.business.businessName}">Business Name</span></div>
                        </div>

                        <form th:action="@{/student/reviews}" th:object="${reviewDto}" method="post">
                            <input type="hidden" th:field="*{gigId}">

                            <div class="mb-4">
                                <label class="form-label">Rating <span class="text-danger">*</span></label>
                                <select th:field="*{rating}" class="form-select" required>
                                    <option value="5">★★★★★ (5 Stars - Exceptional Experience)</option>
                                    <option value="4">★★★★☆ (4 Stars - Very Good Collaboration)</option>
                                    <option value="3">★★★☆☆ (3 Stars - Satisfactory)</option>
                                    <option value="2">★★☆☆☆ (2 Stars - Difficult / Scope Issues)</option>
                                    <option value="1">★☆☆☆☆ (1 Star - Poor Experience)</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Your Feedback / Review Comments <span class="text-danger">*</span></label>
                                <textarea th:field="*{comment}" rows="4" class="form-control" required
                                          placeholder="Describe how the requirements were communicated, feedback turnaround, and overall professionalism..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-navy w-100 py-2">
                                Publish Review
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
