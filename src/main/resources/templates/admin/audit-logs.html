<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs &mdash; GigCampus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <span class="badge bg-danger mb-1">Security & Moderation</span>
                    <h2 class="fw-bold text-navy mb-0"><i class="bi bi-journal-text me-2"></i>Platform Audit Logs</h2>
                    <p class="text-muted small mb-0">Record of administrative interventions, business verifications, and moderations.</p>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-navy btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Admin Dashboard
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Action</th>
                                <th>Target Type</th>
                                <th>Target ID</th>
                                <th>Details</th>
                                <th>IP Address</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    No administrative audit logs recorded yet.
                                </td>
                            </tr>
                            <tr th:each="log : ${logs}">
                                <td class="fw-semibold text-muted" th:text="'#' + ${log.id}">#1</td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary border font-monospace" th:text="${log.action}">ACTION</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${log.targetType}">TARGET</span>
                                </td>
                                <td th:text="${log.targetId != null ? '#' + log.targetId : '-'}">-</td>
                                <td class="small" style="max-width: 320px;" th:text="${log.details}">Details</td>
                                <td class="small font-monospace text-muted" th:text="${log.ipAddress != null ? log.ipAddress : '127.0.0.1'}">IP</td>
                                <td class="small text-muted" th:text="${#temporals.format(log.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
