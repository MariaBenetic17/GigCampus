<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="form-card p-4 p-md-5 shadow-sm border-0" style="box-shadow: var(--gc-shadow-lg) !important;">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center text-white rounded-3 p-2 px-3 fs-4 fw-bold mb-3 shadow-xs" style="background: var(--gc-blue-gradient);">
                                GC
                            </div>
                            <h3 class="fw-bold text-navy mb-1">Welcome Back</h3>
                            <p class="text-muted small">Sign in to your student, business, or administrator account.</p>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label small fw-semibold text-muted">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="email" name="email" class="form-control" required autofocus placeholder="name@domain.com">
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label small fw-semibold text-muted mb-0">Password</label>
                                    <a th:href="@{/forgot-password}" class="small text-decoration-none text-teal fw-semibold" style="color: var(--gc-teal);">Forgot password?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary-gc w-100 py-2 fs-6 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to GigCampus
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-2">New to GigCampus? Join today:</p>
                            <div class="d-flex gap-2 justify-content-center">
                                <a th:href="@{/register/student}" class="small text-decoration-none fw-semibold text-primary">Student Sign Up</a>
                                <span class="text-muted">&bull;</span>
                                <a th:href="@{/register/business}" class="small text-decoration-none fw-semibold text-teal" style="color: var(--gc-teal);">Business Registration</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
