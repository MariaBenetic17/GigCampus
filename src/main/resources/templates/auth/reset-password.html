<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <div class="form-card p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-teal-subtle text-teal rounded-circle p-3 fs-3 mb-2" style="background-color: var(--gc-teal-light); color: var(--gc-teal);">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h3 class="fw-bold text-navy">Set New Password</h3>
                            <p class="text-muted small">Choose a strong, secure password for your GigCampus account.</p>
                        </div>

                        <form th:action="@{/reset-password}" method="post">
                            <input type="hidden" name="token" th:value="${token}">

                            <div class="mb-3">
                                <label for="password" class="form-label">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" name="password" class="form-control" required placeholder="Minimum 6 characters">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required placeholder="Re-enter password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary-gc w-100 py-2 fw-semibold">
                                <i class="bi bi-check2-circle me-1"></i> Update Password
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a th:href="@{/login}" class="small text-decoration-none fw-semibold">
                                &larr; Return to Sign In
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
