<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Businesses &mdash; Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-navy mb-1"><i class="bi bi-buildings-fill text-teal me-2" style="color: var(--gc-teal);"></i>Registered Businesses & MSMEs</h3>
                    <p class="text-muted small mb-0">Total Businesses: <span th:text="${#lists.size(businesses)}">0</span></p>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Back to Overview</a>
            </div>

            <div class="form-card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light small">
                            <tr>
                                <th>Business Name</th>
                                <th>Sector</th>
                                <th>Owner / Contact</th>
                                <th>Location in Erode</th>
                                <th>Gigs Posted</th>
                                <th>Verification Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="b : ${businesses}">
                                <td>
                                    <strong class="text-dark" th:text="${b.businessName}">Business Name</strong>
                                    <div class="small text-muted" th:text="${b.user.email}">email</div>
                                </td>
                                <td th:text="${b.businessCategory}">Sector</td>
                                <td>
                                    <div th:text="${b.user.fullName}">Owner</div>
                                    <div class="small text-muted" th:text="${b.contactPhone != null ? b.contactPhone : b.user.phone}">Phone</div>
                                </td>
                                <td th:text="${b.location}">Location</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${#lists.size(b.gigs)}">0</span>
                                </td>
                                <td>
                                    <span th:if="${b.verificationStatus.name() == 'VERIFIED'}" class="badge-verified">
                                        <i class="bi bi-patch-check-fill"></i> Verified
                                    </span>
                                    <span th:if="${b.verificationStatus.name() == 'PENDING_REVIEW'}" class="badge bg-warning text-dark">
                                        Pending Review
                                    </span>
                                    <span th:if="${b.verificationStatus.name() == 'UNVERIFIED'}" class="badge bg-secondary">
                                        Unverified
                                    </span>
                                    <span th:if="${b.verificationStatus.name() == 'REJECTED'}" class="badge bg-danger">
                                        Rejected
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
