<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderate Gigs &mdash; Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-navy mb-1"><i class="bi bi-shield-check text-navy me-2"></i>Platform Gig Listings</h3>
                    <p class="text-muted small mb-0">Total Listings: <span th:text="${#lists.size(gigs)}">0</span></p>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Back to Overview</a>
            </div>

            <div class="form-card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light small">
                            <tr>
                                <th>Gig Title</th>
                                <th>Business Client</th>
                                <th>Category</th>
                                <th>Budget</th>
                                <th>Status</th>
                                <th>Applications</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="g : ${gigs}">
                                <td>
                                    <a th:href="@{'/gigs/' + ${g.id}}" class="fw-bold text-dark text-decoration-none" th:text="${g.title}">Title</a>
                                    <div class="small text-muted" th:text="${#temporals.format(g.createdAt, 'dd MMM yyyy')}">Date</div>
                                </td>
                                <td>
                                    <div th:text="${g.business.businessName}">Business</div>
                                    <div class="small text-muted" th:text="${g.location}">Location</div>
                                </td>
                                <td th:text="${g.category.name}">Category</td>
                                <td class="fw-semibold text-teal" th:text="${'₹' + g.budget}">₹0</td>
                                <td>
                                    <span class="status-badge" th:classappend="${'status-' + #strings.toLowerCase(g.status.name())}" th:text="${g.status.displayName}">Status</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${#lists.size(g.applications)}">0</span>
                                </td>
                                <td>
                                    <form th:if="${g.status.name() != 'CLOSED'}" th:action="@{'/admin/gigs/' + ${g.id} + '/status'}" method="post">
                                        <input type="hidden" name="status" value="CLOSED">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" data-confirm="Close/unpublish this listing?">
                                            Close
                                        </button>
                                    </form>
                                    <form th:if="${g.status.name() == 'CLOSED'}" th:action="@{'/admin/gigs/' + ${g.id} + '/status'}" method="post">
                                        <input type="hidden" name="status" value="OPEN">
                                        <button type="submit" class="btn btn-sm btn-outline-success" data-confirm="Reopen this listing?">
                                            Reopen
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
