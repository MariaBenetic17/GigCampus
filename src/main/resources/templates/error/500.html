<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5 text-center">
        <div class="container py-5">
            <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm mx-auto" style="max-width: 600px;">
                <div class="display-1 fw-bold text-warning mb-3">500</div>
                <h3 class="fw-bold text-navy mb-2">Unexpected Application Error</h3>
                <p class="text-muted mb-4">
                    Something went wrong while processing your request. Internal system details are kept confidential for safety.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary-gc"><i class="bi bi-house-door me-1"></i> Return Home</a>
                    <a th:href="@{/contact}" class="btn btn-outline-secondary"><i class="bi bi-envelope me-1"></i> Report an Issue</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
