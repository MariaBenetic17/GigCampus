<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a New Gig &mdash; GigCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="form-card p-4 p-md-5">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon bg-light text-teal" style="color: var(--gc-teal);"><i class="bi bi-plus-circle-fill"></i></div>
                            <div>
                                <h3 class="fw-bold text-navy mb-0">Post a Digital Gig Opportunity</h3>
                                <p class="text-muted small mb-0">Hire enthusiastic college talent in Erode for discrete project milestones.</p>
                            </div>
                        </div>

                        <form th:action="@{/business/gigs/new}" th:object="${gigDto}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Gig Title <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       placeholder="e.g. 5-Page Responsive Showcase Website for Textile Wholesale Shop">
                                <div class="invalid-feedback" th:errors="*{title}"></div>
                                <div class="form-text small">Be descriptive about the expected final deliverable.</div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Service Category <span class="text-danger">*</span></label>
                                    <select th:field="*{categoryId}" class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                        <option value="">Select Category</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                    </select>
                                    <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Work Mode <span class="text-danger">*</span></label>
                                    <select th:field="*{workMode}" class="form-select">
                                        <option th:each="wm : ${workModes}" th:value="${wm.name()}" th:text="${wm.displayName}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Detailed Requirements & Scope <span class="text-danger">*</span></label>
                                <textarea th:field="*{description}" rows="6" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                          placeholder="Explain what needs to be created or fixed, any assets or sample documents you will provide, and quality expectations..."></textarea>
                                <div class="invalid-feedback" th:errors="*{description}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Required Digital Skills / Tools <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{requiredSkills}" class="form-control" th:classappend="${#fields.hasErrors('requiredSkills')} ? 'is-invalid'"
                                       placeholder="e.g. HTML, Bootstrap, Canva, Excel VBA, Photoshop">
                                <div class="invalid-feedback" th:errors="*{requiredSkills}"></div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Proposed Milestone Budget (₹) <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text">₹</span>
                                        <input type="number" th:field="*{budget}" class="form-control" th:classappend="${#fields.hasErrors('budget')} ? 'is-invalid'" min="200" step="50" placeholder="e.g. 3500">
                                    </div>
                                    <div class="invalid-feedback" th:errors="*{budget}"></div>
                                    <div class="form-text small">Minimum budget is ₹200. Paid directly to student upon delivery.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Target Completion Deadline</label>
                                    <input type="date" th:field="*{deadline}" class="form-control" th:classappend="${#fields.hasErrors('deadline')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:errors="*{deadline}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Location in Erode (for On-Site/Hybrid meetings)</label>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Veerappanchatram / Brough Road, Erode">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary-gc py-2 px-4">
                                    <i class="bi bi-check-circle-fill me-1"></i> Publish Gig Now
                                </button>
                                <a th:href="@{/business/dashboard}" class="btn btn-outline-secondary py-2 px-3">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
