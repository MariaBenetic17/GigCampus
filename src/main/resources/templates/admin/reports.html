<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Moderation &mdash; Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-navy mb-1"><i class="bi bi-flag-fill text-danger me-2"></i>Content Moderation & Reports</h3>
                    <p class="text-muted small mb-0">Review flagged listings or behavior reports submitted by users.</p>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Back to Overview</a>
            </div>

            <div class="form-card p-4">
                <div th:if="${#lists.isEmpty(reports)}" class="text-center py-5">
                    <i class="bi bi-shield-check fs-1 text-success"></i>
                    <h5 class="fw-bold text-dark mt-3">No Pending Reports</h5>
                    <p class="text-muted small mb-0">Platform listings and discussions are currently clean and compliant.</p>
                </div>

                <div th:unless="${#lists.isEmpty(reports)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light small">
                            <tr>
                                <th>Report Date</th>
                                <th>Reporter</th>
                                <th>Reason</th>
                                <th>Details</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rep : ${reports}">
                                <td class="small text-muted" th:text="${#temporals.format(rep.createdAt, 'dd MMM yyyy')}">Date</td>
                                <td th:text="${rep.reporter.fullName}">Reporter</td>
                                <td class="fw-bold text-dark" th:text="${rep.reason}">Reason</td>
                                <td class="small text-secondary" th:text="${rep.details}">Details</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${rep.status.displayName}">Status</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
